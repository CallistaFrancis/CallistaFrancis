<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callista's Arcade - Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { color: #58a6ff; margin-bottom: 10px; font-size: 1.8rem; }
    p.subtitle { color: #8b949e; margin-bottom: 20px; font-size: 0.95rem; }
    .arcade-container {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 440px;
      width: 100%;
      position: relative;
    }
    .game-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 15px;
      font-weight: bold;
      color: #7ee787;
    }
    .canvas-wrapper {
      position: relative;
    }
    canvas {
      background-color: #010409;
      border: 2px solid #30363d;
      border-radius: 6px;
      display: block;
    }
    /* Custom In-Page Game Over Overlay Card */
    #gameOverOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(2px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      z-index: 10;
    }
    #gameOverOverlay h2 {
      color: #f85149;
      font-size: 1.8rem;
      margin-bottom: 5px;
    }
    #gameOverOverlay p {
      color: #c9d1d9;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }
    .controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 45px);
      gap: 8px;
      justify-content: center;
    }
    .btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.2s;
    }
    .btn:active { background: #30363d; }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-restart {
      margin-top: 15px;
      padding: 8px 16px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-restart:hover { background: #2ea043; }
  </style>
</head>
<body>

  <h1>🕹️ Callista's Profile Arcade</h1>
  <p class="subtitle">Use Arrow Keys or Screen Controls to Play Snake!</p>

  <div class="arcade-container">
    <div class="game-header">
      <span>Score: <span id="score">0</span></span>
      <span>High Score: <span id="highScore">0</span></span>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="360" height="360"></canvas>
      
      <!-- Custom Game Over Popup Inside Container -->
      <div id="gameOverOverlay">
        <h2>GAME OVER</h2>
        <p>Your Score: <span id="finalScore">0</span></p>
        <button class="btn-restart" onclick="resetGame()">Play Again</button>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-up" onclick="changeDir('UP')">⬆️</button>
      <button class="btn btn-left" onclick="changeDir('LEFT')">⬅️</button>
      <button class="btn btn-down" onclick="changeDir('DOWN')">⬇️</button>
      <button class="btn btn-right" onclick="changeDir('RIGHT')">➡️</button>
    </div>

    <button class="btn-restart" onclick="resetGame()">Restart Game</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const grid = 18;
    const tileCount = canvas.width / grid;

    let snake = [{x: 10, y: 10}];
    let food = {x: 5, y: 5};
    let dx = 1, dy = 0;
    let score = 0;
    let highScore = 0;
    let gameInterval;
    let isGameOver = false;

    function gameLoop() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return triggerGameOver();
      }

      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return triggerGameOver();
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById("score").innerText = score;
        if (score > highScore) {
          highScore = score;
          document.getElementById("highScore").innerText = highScore;
        }
        spawnFood();
      } else {
        snake.pop();
      }

      ctx.fillStyle = "#010409";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#f85149";
      ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);

      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#7ee787" : "#238636";
        ctx.fillRect(part.x * grid, part.y * grid, grid - 2, grid - 2);
      });
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    function changeDir(dir) {
      if (isGameOver) return;
      if (dir === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
      if (dir === 'UP' && dy === 0) { dx = 0; dy = -1; }
      if (dir === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
      if (dir === 'DOWN' && dx === 0) { dx = 0; dy = 1; }
    }

    document.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "ArrowUp", "ArrowRight", "ArrowDown", " "].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === "ArrowLeft") changeDir('LEFT');
      if (e.key === "ArrowUp") changeDir('UP');
      if (e.key === "ArrowRight") changeDir('RIGHT');
      if (e.key === "ArrowDown") changeDir('DOWN');
    });

    function triggerGameOver() {
      isGameOver = true;
      clearInterval(gameInterval);
      document.getElementById("finalScore").innerText = score;
      document.getElementById("gameOverOverlay").style.display = "flex";
    }

    function resetGame() {
      clearInterval(gameInterval);
      isGameOver = false;
      document.getElementById("gameOverOverlay").style.display = "none";
      snake = [{x: 10, y: 10}];
      dx = 1; dy = 0;
      score = 0;
      document.getElementById("score").innerText = score;
      spawnFood();
      // Set to 150ms for a slower, smoother pace
      gameInterval = setInterval(gameLoop, 150);
    }

    resetGame();
  </script>
</body>
</html>
